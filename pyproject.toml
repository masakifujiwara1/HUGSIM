[project]
name = "hugsim"
version = "0.1.0"
requires-python = "==3.11.10"
dependencies = [
    "setuptools==78.1.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchmetrics>=1.7.1,<2",
    "roma>=1.5.2.1,<2",
    "matplotlib>=3.10.1,<4",
    "tqdm>=4.67.1,<5",
    "opencv-python>=4.11.0.86,<5",
    "scipy>=1.15.2,<2",
    "einops>=0.8.1,<0.9",
    "trimesh>=4.6.6,<5",
    "tensorboard>=2.19.0,<3",
    "gpustat>=1.1.1,<2",
    "scikit-learn>=1.6.1,<2",
    "open3d>=0.18.0,<0.19",
    "timm>=1.0.15,<2",
    "geometry>=0.0.23,<0.0.24",
    "gymnasium==1.1.1",
    "imageio>=2.37.0,<3",
    "jaxtyping>=0.3.1,<0.4",
    "mediapy>=1.2.3,<2",
    "omegaconf>=2.3.0,<3",
    "pillow>=11.2.1,<12",
    "plyfile>=1.1,<2",
    "pyquaternion>=0.9.9,<0.10",
    "pyyaml>=6.0.2,<7",
    "shapely>=2.1.0,<3",
    "tabulate>=0.9.0,<0.10",
    "protobuf==3.20.2",
    "runx==0.0.6",
    "fire>=0.7.0,<0.8",
    "ninja>=1.11.1.4,<2",
    "h5py>=3.13.0,<4",
    "nose>=1.3.7,<2",
    "dominate>=2.9.1,<3",
    "cffi>=1.17.1,<2",
    "piexif>=1.1.3,<2",
    "jupyter>=1.1.1,<2",
    "ipdb>=0.13.13,<0.14",
    "numpy>=1.24.3,<2",
    "torch-fidelity>=0.3.0,<0.4",
    "huggingface-hub>=0.32.0,<0.33",
    "hugsim-env",
    "simple-knn",
    "gsplat",
    "flow-vis-torch",
    "unidepth",
    "trajdata",
    "tinycudann",
    "kitti360Scripts",
    "simple-waymo-open-dataset-reader",
    "pytorch3d",
    "nuscenes-devkit",
    "moviepy>=2.2.1,<3",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.extra-build-dependencies]
gsplat = ["torch==2.4.1"]
pytorch3d = ["torch==2.4.1"]
tinycudann = ["torch==2.4.1", "setuptools==78.1.0"]
simple-knn = ["torch==2.4.1"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
hugsim-env = { path = "./sim", editable = true }
simple-knn = { path = "./submodules/simple-knn" }
gsplat = { git = "https://github.com/hyzhou404/HUGSIM_splat.git", branch = "main" }
flow-vis-torch = { git = "https://github.com/ChristophReich1996/Optical-Flow-Visualization-PyTorch", branch = "main" }
unidepth = { git = "https://github.com/hyzhou404/UniDepth.git", branch = "main" }
trajdata = { git = "https://github.com/hyzhou404/trajdata.git", branch = "main" }
tinycudann = { git = "https://github.com/NVlabs/tiny-cuda-nn", branch = "master", subdirectory = "bindings/torch" }
kitti360Scripts = { git = "https://github.com/autonomousvision/kitti360Scripts.git", branch = "master" }
simple-waymo-open-dataset-reader = { git = "https://github.com/gdlg/simple-waymo-open-dataset-reader.git", branch = "master" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", branch = "stable" }
nuscenes-devkit = { git = "https://github.com/hyzhou404/nuscenes-devkit.git", branch = "master" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
